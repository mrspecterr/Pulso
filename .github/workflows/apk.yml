# APK — build de release na nuvem do GitHub (Etapa 12).
#
# Dispara em toda tag vX.Y.Z (ou manualmente em Actions → APK → Run
# workflow): npm ci → expo prebuild (CNG: o android/ é gerado aqui e a
# assinatura release é injetada pelo plugins/with-signing.js a partir do
# keystore versionado em signing/) → gradlew assembleRelease → o APK é
# publicado na release da tag. Ninguém precisa de PC: o build acontece
# na máquina do GitHub.

name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # publicar a release com o APK

jobs:
  apk:
    name: APK de release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: JDK 17 (AGP 8.12)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependências
        run: npm ci

      - name: Prebuild (CNG + assinatura release)
        run: npx expo prebuild --platform android --no-install

      - name: assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist-apk/PULSO-${GITHUB_REF_NAME}.apk"
          ls -lh dist-apk

      - name: Publicar APK na release da tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/PULSO-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Artifact (execução manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pulso-apk
          path: dist-apk/*.apk
          if-no-files-found: error
